<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website editor</title>
<!--
  The user test of the Sizing variants (Nov 24, Alberto). Participants try both versions on their own, on desktop, and
  switch between them freely with the Version 1 / Version 2 switch at the bottom. Neutral names, so neither version
  sounds like the right one. The link picks the first version (counterbalancing):
    ?v=a  Version 1 first   ?v=b  Version 2 first
  Version 1 is Raw controls (Font size, Headings, Block spacing), Version 2 is Read or show (Text and headings).
  The preview stays on Desktop at any window width (?viewport=Desktop).
-->
<style>
  :root { --blue: #004CED; --edge: #E6E6E6; --ink: #151517; }
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #switch { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: flex; gap: 4px;
    padding: 4px; background: #fff; border: 1px solid var(--edge); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .12); font: 500 14px/20px system-ui, sans-serif; color: var(--ink); }
  #switch button { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 8px; }
  #switch button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  #switch button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body>
<iframe id="app" title="Website editor"></iframe>
<div id="switch" role="group" aria-label="Version">
  <button data-v="a">Version 1</button>
  <button data-v="b">Version 2</button>
</div>
<script>
  const VARIANTS = { a: 'controls-named', b: 'controls-readshow' };
  const app = document.getElementById('app'), sw = document.getElementById('switch');
  const first = new URLSearchParams(location.search).get('v');
  let cur = null;

  function load(v) {
    if (v === cur) return;
    cur = v;
    app.src = 'app/index.html?bar=0&viewport=Desktop&nocomp=1&b=20261124101847&test=' + v + '#' + VARIANTS[v]; // the query differs, so the editor reloads
    sw.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  }
  sw.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) load(b.dataset.v); });
  load(VARIANTS[first] ? first : 'a');
</script>
</body>
</html>
